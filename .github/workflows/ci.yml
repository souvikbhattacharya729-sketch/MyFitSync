name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-and-tests:
    name: Backend Lint, TypeCheck & Tests
    runs-on: ubuntu-latest

    services:
      sql1:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Str0ngPassw0rd2026!"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ngPassw0rd2026!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies & MS ODBC Driver 18
        run: |
          sudo apt-get update
          sudo apt-get install -y curl apt-transport-https gnupg unixodbc unixodbc-dev
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/microsoft.gpg
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Lint Check
        run: |
          cd backend
          ruff check app/

      - name: Run Ruff Format Check
        run: |
          cd backend
          ruff format --check app/

      - name: Run Mypy Type Check
        run: |
          cd backend
          mypy --explicit-package-bases app

      - name: Run Pytest Test Suite with Coverage Gate (>=85%)
        env:
          DB_HOST: localhost
          DB_PORT: 1433
          DB_NAME: master
          APP_DB_USER: sa
          APP_DB_PASSWORD: "Str0ngPassw0rd2026!"
          SECRET_KEY: "test_secret_key_minimum_32_characters_long_for_ci!"
          ENVIRONMENT: "development"
        run: |
          cd backend
          pytest tests/ -v --cov=app/core --cov=app/services --cov-fail-under=85

  frontend-quality-and-tests:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Unit & Component Tests
        run: |
          cd frontend
          npm test

      - name: Run Production Vite Build
        run: |
          cd frontend
          npm run build

  docker-build-verification:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-and-tests, frontend-quality-and-tests]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          tags: myfitsync-backend:ci

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: myfitsync-frontend:ci
