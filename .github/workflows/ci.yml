name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-and-tests:
    name: Backend Lint, TypeCheck & Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myfitsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myfitsync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies for PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libpq-dev postgresql-client

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff Lint Check
        run: |
          cd backend
          ruff check app/

      - name: Run Ruff Format Check
        run: |
          cd backend
          ruff format --check app/

      - name: Run Mypy Type Check
        run: |
          cd backend
          mypy --explicit-package-bases app

      - name: Run Alembic Migration against PostgreSQL
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/myfitsync_test"
          DB_SSLMODE: disable
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Test Suite with Coverage Gate (>=85%)
        env:
          DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/myfitsync_test"
          TEST_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/myfitsync_test"
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: myfitsync_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_SSLMODE: disable
          SECRET_KEY: "test_secret_key_minimum_32_characters_long_for_ci!"
          ENVIRONMENT: "development"
        run: |
          cd backend
          pytest tests/ -v --cov=app/core --cov=app/services --cov-fail-under=85

  frontend-quality-and-tests:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Unit & Component Tests
        run: |
          cd frontend
          npm test

      - name: Run Production Vite Build
        run: |
          cd frontend
          npm run build

  docker-build-verification:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-and-tests, frontend-quality-and-tests]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          tags: myfitsync-backend:ci

      - name: Build Frontend Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: myfitsync-frontend:ci
