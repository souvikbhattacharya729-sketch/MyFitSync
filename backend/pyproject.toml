[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "UP035", # typing deprecated aliases
    "UP006", # typing deprecated aliases
    "UP007", # X | Y vs Optional
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_decorators = false
warn_unused_ignores = true
warn_redundant_casts = true
disable_error_code = ["assignment", "arg-type", "var-annotated"]
