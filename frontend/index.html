<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MyFitSync - Your Personal Fitness Intelligence" />
    <title>MyFitSync | Personal Fitness Intelligence</title>
    <script>
      // Enforce permanent Light Theme before DOM render
      document.documentElement.classList.remove('dark');
      document.documentElement.classList.add('light');
      try {
        localStorage.setItem('myfitsync_theme', 'light');
      } catch (e) {}
    </script>
  </head>
  <body class="bg-[#F6FAF7] text-[#263D32] antialiased selection:bg-[#DCEFE3] selection:text-[#263D32]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
